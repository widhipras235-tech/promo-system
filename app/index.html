<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff2d2d">

<title>Promo Checkker</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
CAMERA OVERLAY
========================= */
.camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  z-index: 999;
}

.camera.active {
  display: block;
}

/* BACKDROP */
body.camera-open::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 998;
}

/* =========================
SCAN FRAME (KOTAK)
========================= */
.scan-frame {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  
  width: 80%;
  max-width: 320px;
  height: 140px;

  border: 2px solid #00ffcc;
  border-radius: 12px;

  box-shadow: 0 0 20px rgba(0,255,200,0.5);

  z-index: 1000;
  display: none;
}

.scan-frame.active {
  display: block;
}

/* ANIMASI GARIS SCAN */
.scan-line {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: #00ffcc;

  animation: scanMove 2s linear infinite;
}

@keyframes scanMove {
  0% { top: 0; }
  100% { top: 100%; }
}

/* TEXT INFO */
.scan-text {
  position: fixed;
  top: calc(50% + 100px);
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 14px;
  z-index: 1000;
  display: none;
}

.scan-text.active {
  display: block;
}

/* =========================
SCAN BAR (FIX)
========================= */
#scanBar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  align-items: center;
  justify-content: space-between;

  width: 160px;
  height: 60px;

  background: #ff3b30;
  border-radius: 40px;

  box-shadow: 0 8px 20px rgba(0,0,0,0.25);

  z-index: 1001;
  padding: 0 10px;
}

.scan-icon {
  flex: 1;
  height: 100%;
  border: none;
  background: transparent;

  display: flex;
  align-items: center;
  justify-content: center;
}

.divider {
  width: 1px;
  height: 60%;
  background: rgba(255,255,255,0.5);
}

/* CLOSE BUTTON */
.btn-close {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1001;
  background: rgba(0,0,0,0.5);
  color: white;
  border: none;
  font-size: 18px;
  padding: 8px 12px;
  border-radius: 8px;
  display: none;
}

.btn-close.active {
  display: block;
}

/* ICON IMAGE */
.icon-img {
  width: 26px;
  height: 26px;
  object-fit: contain;
  pointer-events: none;
  filter: brightness(0) invert(1);
}

#scanBar {
  backdrop-filter: blur(10px);
}

</style>

</head>

<body>

<header class="header">

<div class="logo">
<h1>CapeeX</h1>
<p>Cek Promo • Scan SKU • Online</p>
</div>

<div class="search-box">

<input id="search" placeholder="Cari SKU, artikel, deskripsi, brand">
<button class="search-btn">🔍</button>

</div>

</header>

<main>
<div id="status">Loading...</div>
<div id="result"></div>
</main>

<!-- BUTTON CAMERA -->
<div id="scanBar">

  <button id="btnCamera" class="scan-icon">
    <img src="assets/camera.png" class="icon-img">
  </button>

  <div class="divider"></div>

  <button id="btnVoice" class="scan-icon">
    <img src="assets/mic.png" class="icon-img">
  </button>

</div>

<!-- CLOSE -->
<button id="btnClose" class="btn-close">✕</button>

<!-- CAMERA -->
<video id="camera" autoplay playsinline class="camera"></video>

<!-- SCAN FRAME -->
<canvas id="canvas" style="display:none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<script src="app.js"></script>

</body>
</html>
