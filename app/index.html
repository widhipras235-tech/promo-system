<style>

/* =========================
FLASH EFFECT
========================= */
.flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  z-index: 1003;
  pointer-events: none;
}

.flash.active {
  animation: flashAnim 0.3s ease;
}

@keyframes flashAnim {
  0% { opacity: 0; }
  50% { opacity: 0.8; }
  100% { opacity: 0; }
}

/* =========================
CAMERA + OVERLAY
========================= */
.camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.camera.active {
  display: block;
}

/* overlay khusus */
#overlay {
  z-index: 10000;
  pointer-events: none;
}

/* video di bawah overlay */
#camera {
  z-index: 9999;
}

/* backdrop */
body.camera-open::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 998;
}

#overlay.active {
  display: block;
}

/* =========================
SCAN BAR
========================= */
#scanBar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(0);

  display: flex;
  align-items: center;
  justify-content: space-between;

  width: 160px;
  height: 60px;

  background: #ff3b30;
  border-radius: 40px;

  box-shadow: 0 8px 20px rgba(0,0,0,0.25);

  z-index: 1001;
  padding: 0 10px;

  backdrop-filter: blur(12px);
}

.scan-icon {
  flex: 1;
  height: 100%;
  border: none;
  background: transparent;

  display: flex;
  align-items: center;
  justify-content: center;
}

.divider {
  width: 1px;
  height: 60%;
  background: rgba(255,255,255,0.5);
}

/* CLOSE BUTTON */
.btn-close {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 20000;
  background: rgba(0,0,0,0.5);
  color: white;
  border: none;
  font-size: 18px;
  padding: 8px 12px;
  border-radius: 8px;
  display: none;
}

.btn-close.active {
  display: block;
}

/* ICON */
.icon-img {
  width: 26px;
  height: 26px;
  object-fit: contain;
  pointer-events: none;
  filter: brightness(0) invert(1);
}

/* =========================
AUTO HIDE ANIMATION
========================= */

#scanBar {
  transition: transform 0.3s ease, opacity 0.3s ease;
}

/* kondisi hidden */
#scanBar.hide {
  transform: translateX(-50%) translateY(120px);
  opacity: 0;
  pointer-events: none;
}

#scanText {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);

  color: white;
  font-size: 12px;
  font-weight: 500;
  text-align: center;

  z-index: 20001; /* 🔥 penting */
  pointer-events: none;

  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  opacity: 0;

  transition: opacity 0.3s ease;
}

#scanText.active {
  opacity: 1;
}

#scanText {
  backdrop-filter: blur(4px);
  padding: 6px 12px;
  border-radius: 10px;
}

.md-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Google Style */
.md-modal{
  width:90%;
  max-width:360px;
  background:white;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
  overflow:hidden;
  animation:mdFade 0.2s ease;
}

@keyframes mdFade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.md-header{
  padding:16px;
  font-weight:bold;
  font-size:16px;
}

.md-body{
  padding:0 16px 16px;
  font-size:14px;
  color:#444;
}

.md-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding:8px;
}

.md-actions button{
  border:none;
  background:none;
  padding:10px;
  cursor:pointer;
}

.md-primary{
  background:#d32f2f;
  color:white;
  padding:10px 14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:500;
}
</style>

</head>

<body>

<header class="header" id="header">

  <div class="header-top">
    <div class="logo">
     <h1 class="logo">Capee<span>X</span></h1>
<p class="subtext">Cek Promo • Scan SKU • Online</p>
    </div>
  </div>

  <div class="header-search">

<main>

<!-- SCAN BAR -->

  <button id="btnCamera" class="scan-icon">

  <div class="divider"></div>

  <button id="btnVoice" class="scan-icon">
    <img src="assets/mic.png" class="icon-img">
  </button>

</div>

<!-- FLASH -->
<div id="flash" class="flash"></div>

<!-- CLOSE BUTTON -->
<button id="btnClose" class="btn-close">✕</button>

<!-- CAMERA -->
<video id="camera" autoplay playsinline class="camera"></video>

<!-- OVERLAY (WAJIB untuk drag scan) -->
<canvas id="overlay" class="camera"></canvas>

<div id="scanText">Usap layar arahkan ke SKU</div>

<!-- CANVAS OCR -->

<!-- LIB OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<!-- APP -->
<script src="app.js"></script>

    </div>

    <div class="md-actions">
      <button onclick="closeModal()">Tutup</button>
      <a href="https://wa.me/628xxxx" class="md-primary">CHAT ADMIN</a>
    </div>

  </div>
</div>
